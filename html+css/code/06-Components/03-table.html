<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /*
      SPACING SYSTEM (px)
      2 / 4 / 8 / 12 / 16 / 24 / 32 / 48 / 64 / 80 / 96 / 128

      FONT SIZE SYSTEM (px)
      10 / 12 / 14 / 16 / 18 / 20 / 24 / 30 / 36 / 44 / 52 / 62 / 74 / 86 / 98
      */

      /*
      MAIN COLOR: #087f5b
      GRAY COLOR: #343a40
      */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* ------------------------ */
      /* GENERAL STYLES */
      /* ------------------------ */
      body {
        font-family: "Inter", sans-serif;
        color: #343a40;
        line-height: 1;
        display: flex;
        justify-content: center;
      }

      table{
        width: 800px;
        /* background-color: red; */
        margin-top: 100px;
        font-size: 16px;
        border: 1px solid #343a40;
        border-collapse: collapse;
        border: none;
      }

      th, td {
        border: 1px solid #343a40;
        height: 60px;
        text-align: left;
        border: none;
        padding-left: 20px;
      }

      thead th {
        background-color: #087f5b;
        color: #fff;
        width: 25%;
        padding-left: 20px;
      }

      tbody tr:nth-child(odd){
        background-color: rgb(211, 242, 119);
      }

      tbody tr:nth-child(even){
        background-color: rgb(255, 219, 219);
      }
    </style>
  </head>
  <body>
    <table>
      <thead>
      <tr>
        <th>Chair</th>
        <th>The Laid Back</th>
        <th>The Worker Bee</th>
        <th>The Chair 4/2</th>
      </thead>

      <tbody>
      </tr>
      <tr>
        <th>Width</th>
        <td>80cm</td>
        <td>60cm</td>
        <td>220cm</td>
      </tr>
      <tr>
        <th>Depth</th>
        <td>70cm</td>
        <td>65cm</td>
        <td>80cm</td>
      </tr>
      <tr>
        <th>Weight</th>
        <td>16 kg</td>
        <td>22 kg</td>
        <td>80 kg</td>
      </tr>
      <tr>
        <th>Width</th>
        <td>80cm</td>
        <td>60cm</td>
        <td>220cm</td>
      </tr>
    </tbody>
    </table>
  </body>
</html>
