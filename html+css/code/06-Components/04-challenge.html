<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    /*
    SPACING SYSTEM (px)
    2 / 4 / 8 / 12 / 16 / 24 / 32 / 48 / 64 / 80 / 96 / 128

    FONT SIZE SYSTEM (px)
    10 / 12 / 14 / 16 / 18 / 20 / 24 / 30 / 36 / 44 / 52 / 62 / 74 / 86 / 98
    */

    /*
    MAIN COLOR: #087f5b
    GRAY COLOR: #343a40
    */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* ------------------------ */
    /* GENERAL STYLES */
    /* ------------------------ */
    body {
      font-family: "Inter", sans-serif;
      color: #343a40;
      line-height: 1;
      display: flex;
      justify-content: center;
    }
    .container {
      display: flex;
      gap: 15px;
      /* width: 150px; */
      margin-top: 100px;
      align-items: center;
    }

    .number-btns {
      display: flex;
      /* width: 150px; */
      background-color: #fff;
      /* border: 2px solid #087f5b; */
      border-radius: 50%;
    }

    .btn--right,
    .btn--left {
      background-color: #fff;
      height: 40px;
      width: 40px;
      border-radius: 50%;
      cursor: pointer;
      border: 1px solid #087f5b;
    }
    button {
      background-color: #fff;
      border: none;
      height: 30px;
      width: 30px;
      border-radius: 50%;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      justify-items: center;
      align-content: center;
    }
    button:hover {
      background-color: #087f5b;
      color: #fff;
    }
    button:hover .icon {
      stroke: #fff;
    }
    button:hover .page-link:link {
      color: #fff;
    }
    .icon {
      height: 24px;
      width: 24px;
      stroke: #087f5b;
    }

    .page-link:link,
    .page-link:visited {
      color: #343a40;
      text-decoration: none; /* 去掉下划线 */
      display: inline-block;
    }
    .page-link:hover,
    .page-link:active,
    .page-link.page-link--current {
      background-color: #087f5b;
      color: #fff;
    }
  </style>
  <body>
    <div class="container">
      <button class="btn--left">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="icon"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15.75 19.5 8.25 12l7.5-7.5"
          />
        </svg>
      </button>
      <!-- <div class="number-btns"> -->
      <button class="btn--num">
        <a href="#" class="page-link">1</a>
      </button>
      <button class="btn--num">
        <a href="#" class="page-link">2</a>
      </button>
      <button class="btn--num page-link--current">
        <a href="#" class="page-link">3</a>
      </button>
      <button class="btn--num">
        <a href="#" class="page-link">4</a>
      </button>
      <button class="btn--num">
        <a href="#" class="page-link">5</a>
      </button>
      <button class="btn--num">
        <a href="#" class="page-link">6</a>
      </button>
      <!-- </div> -->
      <span class="dots">...</span>
      <button class="btn--num">
        <a href="#" class="page-link">23</a>
      </button>
      <button class="btn--right">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="icon"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m8.25 4.5 7.5 7.5-7.5 7.5"
          />
        </svg>
      </button>
    </div>
  </body>
</html>
