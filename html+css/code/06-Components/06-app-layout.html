<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /*
      SPACING SYSTEM (px)
      2 / 4 / 8 / 12 / 16 / 24 / 32 / 48 / 64 / 80 / 96 / 128

      FONT SIZE SYSTEM (px)
      10 / 12 / 14 / 16 / 18 / 20 / 24 / 30 / 36 / 44 / 52 / 62 / 74 / 86 / 98
      */

      /*
      MAIN COLOR: #087f5b
      GRAY COLOR: #343a40
      */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* ------------------------ */
      /* GENERAL STYLES */
      /* ------------------------ */
      body {
        font-family: "Inter", sans-serif;
        color: #343a40;
        font-size: 24px;

        display: grid;
        grid-template-columns: 80px 400px 1fr 250px;
        grid-template-rows: 80px 1fr;
        height: 100vh;
        text-align: center;
        font-weight: bold;
      }

      nav,
      menu,
      section,
      main,
      aside {
        padding-top: 24px;
      }

      nav {
        background-color: #686651;
        color: white;
        grid-row: 1 / -1;
      }
      menu {
        background-color: #ffa3a3;
        color: white;
        grid-column: 2 / -1;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 30px 12px;
        /* justify-content: space-between; */
      }
      button {
        display: inline-block;
        font-size: 16px;
        font-weight: bold;
        background-color: #ff9393;
        border: none;
        cursor: pointer;
        color: #fff;
        padding: 8px 12px;
      }
      button:nth-child(5) {
        background-color: #aec80a;
        margin-left: auto;
      }
      section {
        background-color: #dcecc1;
        padding: 40px;

        /* How elements that don't fit into container */
        overflow: scroll;

        display: flex;
        flex-direction: column;
        gap: 40px;
      }
      .email {
        background-color: #ffbaba;
        height: 96px;
        flex-shrink: 0;

        display: flex;
        align-items: center;
        justify-content: center;
      }
      main {
        background-color: #f3f6e5;
      }
      aside {
        background-color: #dcecc1;
      }
    </style>
  </head>
  <body>
    <nav>Nav</nav>
    <menu>
      <button>New</button>
      <button>Reply</button>
      <button>Forward</button>
      <button>Mark Unread</button>
      <button>Trash</button>
    </menu>
    <section>
      <div class="email">Email 1</div>
      <div class="email">Email 2</div>
      <div class="email">Email 3</div>
      <div class="email">Email 4</div>
      <div class="email">Email 5</div>
      <div class="email">Email 6</div>
      <div class="email">Email 7</div>
      <div class="email">Email 8</div>
      <div class="email">Email 9</div>
    </section>
    <main>Email view</main>
    <aside>Additional Info</aside>
  </body>
</html>
